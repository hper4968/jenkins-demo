<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #1f2937;
      color: white;
      padding: 2rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    header p {
      margin: 0.5rem 0 0;
      font-size: 1.2rem;
      color: #d1d5db;
    }

    section {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #1f2937;
    }

    .project {
      background-color: white;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-left: 4px solid #3b82f6;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 2rem;
      background-color: #1f2937;
      color: white;
      margin-top: 3rem;
    }

    a {
      color: #3b82f6;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hemal</h1>
    
  </header>

  <section>
    <div class="section-title">About Me </div>
    <p>
     Hello
    </p>
  </section>

  <footer>
    &copy; Hemal
  </footer>

</body>
</html>
